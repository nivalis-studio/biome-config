saveExact: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustLockfile: true

onlyBuiltDependencies:
  - lefthook

allowBuilds:
  lefthook: true

catalog:
  "@biomejs/biome": 2.6.4
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  bumpp: 12.3.0
  lefthook: 2.2.2
  taze: 21.3.0
