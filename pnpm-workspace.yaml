saveExact: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustLockfile: true

onlyBuiltDependencies:
  - lefthook

allowBuilds:
  lefthook: true

catalog:
  "@biomejs/biome": 2.6.6
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  bumpp: 12.3.0
  lefthook: 2.2.2
  taze: 21.3.0
minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.6"
  - "@biomejs/cli-android-arm64@2.6.6"
  - "@biomejs/cli-android-x64@2.6.6"
  - "@biomejs/cli-darwin-arm64@2.6.6"
  - "@biomejs/cli-darwin-x64@2.6.6"
  - "@biomejs/cli-linux-arm64-musl@2.6.6"
  - "@biomejs/cli-linux-arm64@2.6.6"
  - "@biomejs/cli-linux-x64-musl@2.6.6"
  - "@biomejs/cli-linux-x64@2.6.6"
  - "@biomejs/cli-win32-arm64@2.6.6"
  - "@biomejs/cli-win32-x64@2.6.6"
